plugins {
    id 'net.fabricmc.fabric-loom' version '1.20.0-alpha.31'
}

version = "1.5.1"
group = "com.soulfamiliar"

base {
    archivesName = "SoulFamiliar-26.3"
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.20.1"
    implementation "net.fabricmc.fabric-api:fabric-api:0.167.0+26.3"
    compileOnly files("libs/ArmorPoser-fabric-26.3-16.0.2.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
