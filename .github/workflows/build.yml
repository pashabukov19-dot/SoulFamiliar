name: Build SoulFamiliar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Inspect ArmorPoser API
        run: |
          JAR="libs/ArmorPoser-fabric-26.3-16.0.2.jar"
          echo "=== FABRIC.MOD.JSON ==="
          unzip -p "$JAR" fabric.mod.json
          echo ""
          echo "=== PACKET SIGNATURES ==="
          javap -cp "$JAR" -p com.mrbysco.armorposer.data.SyncData com.mrbysco.armorposer.packets.v1.ArmorStandSyncPayload com.mrbysco.armorposer.platform.Services com.mrbysco.armorposer.platform.services.IPlatformHelper
